spring:
  application:
    name: skillbridge
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${POSTGRES_PORT:5434}/${POSTGRES_DB:skillbridge}
    username: ${POSTGRES_USER:skillbridge}
    password: ${POSTGRES_PASSWORD:skillbridge}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

server:
  port: 8080
  servlet:
    context-path: /api

skillbridge:
  jwt:
    secret: ${JWT_SECRET:dev-only-secret-change-me-dev-only-secret-change-me}
    ttl-minutes: 1440
  openai:
    api-key: ${OPENAI_API_KEY:}
    model: ${OPENAI_MODEL:gpt-4o-mini}
    base-url: ${OPENAI_BASE_URL:https://api.openai.com/v1}
    timeout-seconds: 90
  hh:
    user-agent: ${HH_USER_AGENT:SkillBridge/0.1}
    base-url: ${HH_BASE_URL:https://api.hh.ru}
    token-url: ${HH_TOKEN_URL:https://api.hh.ru/token}
    app-token: ${HH_APP_TOKEN:}
    client-id: ${HH_CLIENT_ID:}
    client-secret: ${HH_CLIENT_SECRET:}
    area: ${HH_AREA:40}   # 40 = Kazakhstan
    per-profession-limit: 50
    schedule-enabled: ${HH_SCHEDULE_ENABLED:false}
  telegram:
    bot-token: ${TELEGRAM_BOT_TOKEN:}
    channel: ${TELEGRAM_CHANNEL:}   # public username without @, or numeric id -100...
    api-base-url: ${TELEGRAM_API_BASE_URL:https://api.telegram.org}
    polling-enabled: ${TELEGRAM_POLLING_ENABLED:false}
  admin-emails: ${ADMIN_EMAILS:}
  storage:
    path: ${STORAGE_PATH:./storage}
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:3000}

management:
  endpoints:
    web:
      exposure:
        include: health,info
